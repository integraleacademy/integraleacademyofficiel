name: Visual inventory
on:
  push:
    branches: ['codex/unique-visuals-20261008']
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/audit-visual-inventory.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-inventory
          path: artifacts/visual-inventory.json
