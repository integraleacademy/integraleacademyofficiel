name: UI consistency review
on:
  push:
    branches: [codex/harmonisation-menus-faq-20261015]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply scoped component migration
        run: |
          if grep -q INSERT_ORIGINAL_FAQ_THEMES src/components/FAQ.tsx; then python3 .github/ui-consistency-update.py; fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/FAQ.tsx')
          p.write_text(p.read_text().replace('\nconst premiumFaqThemes:', '\nexport const premiumFaqThemes:'))
          p = Path('src/components/ui.tsx')
          s = p.read_text()
          imp = "import { premiumFaqThemes } from '@/components/FAQ';\n"
          if imp not in s: p.write_text(imp + s)
          PY
      - name: Install and generate Prisma client
        run: npm ci && npx prisma generate
      - name: Regression tests
        run: |
          node --test tests/site-ui-consistency.test.mjs
          npm run test:home-cards
          npm run test:a3p
      - name: Production build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-ui.log
      - name: Browser setup
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Desktop and mobile browser verification
        run: |
          npm start > server-ui.log 2>&1 &
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:3000/contact > /dev/null && break; sleep 2; done
          node scripts/test-site-ui.mjs
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-verification
          retention-days: 3
          path: |
            ui-artifacts
            build-ui.log
            server-ui.log
      - name: Commit verified application changes only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts/test-site-ui.mjs tests/site-ui-consistency.test.mjs
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'fix: harmonise chapter menus and all FAQ layouts with the reference pages'
            gh auth setup-git
            git push origin HEAD:codex/harmonisation-menus-faq-20261015
          fi
          git rev-parse HEAD
