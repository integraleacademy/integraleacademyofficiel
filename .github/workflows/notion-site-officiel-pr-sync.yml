name: Notion Site officiel - synchroniser la PR

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: notion-site-officiel-pr-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sync:
    name: Mettre à jour le statut Notion
    if: >-
      github.event.pull_request.user.login == 'integraleacademy' &&
      startsWith(github.event.pull_request.head.ref, 'work/notion-site-officiel-') &&
      contains(github.event.pull_request.body, '<!-- notion-page-id:')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Extraire la page Notion de la PR
        id: metadata
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          body = os.environ.get("PR_BODY", "")
          match = re.search(
              r"<!--\s*notion-page-id:\s*([0-9a-fA-F-]{32,36})\s*-->",
              body,
          )
          if not match:
              raise SystemExit("Aucun marqueur notion-page-id valide dans la PR.")

          compact = re.sub(r"[^0-9a-fA-F]", "", match.group(1)).lower()
          if len(compact) != 32:
              raise SystemExit("Identifiant Notion invalide.")

          page_id = (
              f"{compact[:8]}-{compact[8:12]}-{compact[12:16]}-"
              f"{compact[16:20]}-{compact[20:]}"
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"page_id={page_id}\n")
          PY

      - name: Répercuter la fermeture de la PR dans Notion
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          PAGE_ID: ${{ steps.metadata.outputs.page_id }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          MERGED: ${{ github.event.pull_request.merged }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXPECTED_DATABASE_ID: cfb1a7f4-3fa2-4586-a017-dbf23f690183
          EXPECTED_DATA_SOURCE_ID: 7f12fe92-dbc4-40c8-af4e-77578b5dbfc0
          EXPECTED_PLATFORM: Site internet officiel
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          token = os.environ.get("NOTION_API_TOKEN", "").strip()
          if not token:
              raise SystemExit(
                  "Le secret GitHub NOTION_API_TOKEN est absent ou inaccessible."
              )

          merged = os.environ.get("MERGED", "").lower() == "true"
          status = "Publié" if merged else "En attente"
          error = "" if merged else "La pull request a été fermée sans être fusionnée."
          now = datetime.now(timezone.utc).isoformat(timespec="seconds")

          def rich_text(value):
              if not value:
                  return []
              return [{"type": "text", "text": {"content": value}}]

          def normalize_id(value):
              return "".join(
                  character for character in (value or "") if character.isalnum()
              ).lower()

          def notion_request(method, payload=None):
              data = None
              if payload is not None:
                  data = json.dumps(payload, ensure_ascii=False).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.notion.com/v1/pages/{os.environ['PAGE_ID']}",
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Notion-Version": "2022-06-28",
                      "Content-Type": "application/json",
                  },
              )

              for attempt in range(1, 4):
                  try:
                      with urllib.request.urlopen(request, timeout=20) as response:
                          if response.status != 200:
                              raise SystemExit(
                                  f"Notion a répondu avec le statut HTTP {response.status}."
                              )
                          return json.load(response)
                  except urllib.error.HTTPError as exc:
                      detail = exc.read().decode("utf-8", errors="replace")
                      transient = exc.code == 429 or 500 <= exc.code <= 599
                      if not transient or attempt == 3:
                          raise SystemExit(
                              f"Échec de la requête Notion {method} ({exc.code}) : {detail}"
                          )
                      retry_after = exc.headers.get("Retry-After", "")
                      requested_delay = (
                          int(retry_after) if retry_after.isdigit() else 2 ** (attempt - 1)
                      )
                      delay = min(requested_delay, 30)
                      print(
                          f"Notion indisponible ({exc.code}), "
                          f"nouvelle tentative dans {delay}s."
                      )
                      time.sleep(delay)
                  except urllib.error.URLError as exc:
                      if attempt == 3:
                          raise SystemExit(f"Notion reste inaccessible : {exc.reason}")
                      delay = 2 ** (attempt - 1)
                      print(f"Notion inaccessible, nouvelle tentative dans {delay}s.")
                      time.sleep(delay)

          page = notion_request("GET")
          parent = page.get("parent") or {}
          parent_ids = {
              normalize_id(parent.get("database_id")),
              normalize_id(parent.get("data_source_id")),
          } - {""}
          expected_parent_ids = {
              normalize_id(os.environ["EXPECTED_DATABASE_ID"]),
              normalize_id(os.environ["EXPECTED_DATA_SOURCE_ID"]),
          }
          if not parent_ids & expected_parent_ids:
              raise SystemExit(
                  "La page Notion n’appartient pas à la base « 🧠 Mon cerveau » attendue."
              )

          platform_property = (page.get("properties") or {}).get("Plateforme") or {}
          platform = (platform_property.get("select") or {}).get("name")
          if platform != os.environ["EXPECTED_PLATFORM"]:
              raise SystemExit(
                  "La page Notion n’a pas la plateforme "
                  "« Site internet officiel » attendue."
              )

          payload = {
              "properties": {
                  "Statut": {"select": {"name": status}},
                  "Publié en bas": {"checkbox": merged},
                  "PR GitHub": {"url": os.environ["PR_URL"]},
                  "Branche GitHub": {"rich_text": rich_text(os.environ["BRANCH"])},
                  "Run GitHub": {"url": os.environ["RUN_URL"]},
                  "Erreur automatisation": {"rich_text": rich_text(error)},
                  "Dernier traitement IA": {"date": {"start": now}},
              }
          }

          notion_request("PATCH", payload)
          print(f"Page Notion synchronisée avec le statut « {status} ».")
          PY

          # La propriété « Validé après publication » est volontairement absente :
          # elle reste strictement manuelle et réservée à Clément.
